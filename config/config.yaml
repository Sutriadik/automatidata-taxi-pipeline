paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  models_dir: "models"
  raw_data_filename: "2017_Yellow_Taxi_Trip_Data.csv"
  processed_data_filename: "processed_taxi_data.csv"
  route_stats_filename: "route_stats.json"
  regressor_filename: "fare_regressor.pkl"
  classifier_filename: "tip_classifier.pkl"

preprocessing:
  iqr_factor: 6.0
  validation_split: 0.20
  random_state: 42

tuning:
  n_iter: 10
  cv: 3

models:
  regressor:
    rf_params:
      n_estimators: [50, 100, 150]
      max_depth: [5, 10, 15, null]
      min_samples_leaf: [1, 2, 4]
    xgb_params:
      n_estimators: [50, 100, 150]
      max_depth: [3, 5, 8]
      learning_rate: [0.01, 0.05, 0.1, 0.2]
      subsample: [0.7, 0.8, 1.0]
  classifier:
    rf_params:
      n_estimators: [50, 100, 150, 200]
      max_depth: [5, 10, 15, 20, null]
      min_samples_leaf: [1, 2, 4]
      min_samples_split: [2, 5, 10]
    xgb_params:
      n_estimators: [50, 100, 150, 200]
      max_depth: [3, 5, 7, 9]
      learning_rate: [0.01, 0.05, 0.1, 0.15, 0.2]
      subsample: [0.6, 0.8, 1.0]
      colsample_bytree: [0.6, 0.8, 1.0]
